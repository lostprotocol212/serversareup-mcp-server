# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - sauApiToken
    properties:
      sauApiToken:
        type: string
        description: Scoped Personal Access Token (sau_...) generated at https://serversareup.com/account/api-keys
      sauApiBase:
        type: string
        default: https://serversareup.com
        description: Servers Are Up API base URL
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['dist/index.js'],
      env: {
        SAU_API_TOKEN: config.sauApiToken,
        SAU_API_BASE: config.sauApiBase || 'https://serversareup.com'
      }
    })
